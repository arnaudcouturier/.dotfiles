# Managed by ./dot fedora-setup; do not hand-edit without re-running it.
#
# Noctalia Greeter bundles its own focused wlroots login compositor: greetd
# starts noctalia-greeter-session, not Umbriel, niri, cage, or the UI binary
# directly. The chosen desktop session starts Umbriel only after login
# through start-umbriel (see umbriel.desktop).
#
# No [initial_session]: that key is greetd autologin, and this machine asks.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greeter"
