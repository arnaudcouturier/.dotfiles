# Managed by ./dot fedora-setup via stow; edit the repo, then ./dot stow.
#
# Vanilla Umbriel packaged defaults plus two personal overrides.
# The packaged example lives at /usr/share/umbriel/config.toml; values here
# win over every include, and [keybinds] merges key by key, so only Mod+K
# and Mod+Return differ from the package. All other bindings, scrolling
# behavior, workspaces, gestures and appearance stay packaged defaults.
#
# Validate without starting the compositor:
#   umbriel validate
#   umbriel validate -c ~/.config/umbriel/config.toml
[include]
files = ["/usr/share/umbriel/config.toml", "noctalia.toml"]

# One shell lifecycle owner: the compositor starts Noctalia once at login.
# Upstream's documented compositor-startup pattern; no separate user service.
[general]
autostart = ["noctalia"]

# Personal keybindings: Super+K opens Umbriel's native cheatsheet, Super+Enter
# opens ghostty. Mod+K replaces the packaged Vim-style focus-up; Mod+Up still
# focuses upward. Mod+Return overrides the packaged kitty terminal.
# Mod+Alt+K cycles keyboard layouts (no Menu key on this keyboard; upstream
# recipe from the packaged defaults).
[keybinds]
"Mod+K" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod+E" = { action = "spawn:nautilus", repeat = false }
"Mod+W" = { action = "spawn:brave-origin", repeat = false }
"Mod+Alt+K" = { action = "keyboard-layout-next", repeat = false }
"Mod+P" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Mod+Shift+P" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Mod+Shift+A" = { action = "spawn:noctalia msg screenshot-annotate", repeat = false }
"Mod+Ctrl+A" = { action = "spawn:noctalia msg annotate", repeat = false }

# ── Optional placeholders ─────────────────────────────────────────────
# Everything below stays commented, so packaged defaults apply. Uncomment
# and adapt what you want, then run `umbriel validate`.
# Full docs: https://docs.noctalia.dev/umbriel/

# Monitors: list connector names and modes with `umbriel outputs` first.
# Machine-specific, so keep commented unless the name is this machine's.
# Docs: https://docs.noctalia.dev/umbriel/outputs/
[output."ASUSTek COMPUTER INC PG32UCDM S6LMQS106636"]
mode = "3840x2160@240.016"  # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ (`umbriel outputs`: 240.016 current)
#position = [0, 0]        # logical top-left; omit for automatic placement
scale = 1            # logical size is mode size divided by scale
vrr = "disabled"       # disabled, always, or fullscreen
hdr = "off"           # off, on, auto, or fullscreen; Docs: https://docs.noctalia.dev/umbriel/outputs/#hdr
# sdr_white = 203        # SDR reference white in cd/m2 during HDR, 80-1000
# workspaces = 5           # fixed count; omit for dynamic workspaces

# Laptop panel placeholder (this machine, 2026-09-18 `umbriel outputs`):
# eDP-1 "Samsung Display Corp. 0x4215 0x0000FFA1", preferred 2880x1800@120.
# Monitor form so it applies only to this panel; active on this laptop.
[output."Samsung Display Corp. 0x4215 0x0000FFA1"]
mode = "2880x1800@120"
scale = 1.5            # starting point for 14" 2880x1800; adjust to taste

# Workspaces: global behavior (per-output inventory lives in [output.*]).
# Docs: https://docs.noctalia.dev/umbriel/workspaces/
# [workspaces]
# back_and_forth = true  # re-select the active workspace to jump back

# Layout: default tiling mode and gaps; workspace rules can override these.
# Docs: https://docs.noctalia.dev/umbriel/layout/
# [layout]
# mode = "scrolling"  # scrolling, dwindle, or master
# gap = 8             # logical pixels between tiles, 0-500

# Input: US default plus Canadian Multilingual Standard (CSA), Alt+Shift toggles.
# Device names for per-device [[input.device]] overrides come from `libinput list-devices`.
# Docs: https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
layout = "us,ca"
variant = ",multix"
# Cursor: explicit theme+size so the compositor does not depend on env
# propagation. theme="" would fall back to $XCURSOR_THEME, but size always
# comes from here (packaged default is 24); keep in sync with
# environment.d/10-cursor.conf and gsettings cursor-size.
# Applies on `umbriel msg config-reload`. Docs: https://docs.noctalia.dev/umbriel/input/#cursor
[input.cursor]
theme = "Bibata-Modern-Ice"
size = 32
# [input.touchpad]
# natural_scroll = true
# [input.keyboard]
# layout = "us"  # e.g. "us,de"; empty uses the system default

# Scratchpad terminal: uncomment, launch a window with a matching app-id,
# then summon it anywhere with Mod+Space.
# Docs: https://docs.noctalia.dev/umbriel/scratchpads/
# [[scratchpad]]
# name = "terminal"
# [[window_rule]]
# match.app_id = "^scratchpad-terminal$"
# default_scratchpad = "terminal"
# default_floating = true
# default_width = 0.6
# default_height = 0.5

# Window rules: float picture-in-picture windows (browsers expose no PiP role
# for the compositor to match on).
# Docs: https://docs.noctalia.dev/umbriel/window-rules/
# [[window_rule]]
# match.title = "^(Picture-in-Picture|Picture in picture)$"
# default_floating = true
# default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Media keys (Noctalia usually owns volume/brightness; these are spares).
# Docs: https://docs.noctalia.dev/umbriel/keybinds/
# "XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
# "XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
# "XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
# "XF86AudioPlay" = "spawn:playerctl play-pause"

# Second-monitor navigation: -next/-previous wrap, so one bind each reaches
# the other screen of a two-monitor setup.
# "Mod+Tab" = "output-focus-next"
# "Mod+Shift+Tab" = "window-move-to-output-next"

# Lid events (laptop): run a command when the lid closes or opens.
# [events]
# lid_close = "notify-send 'The laptop lid is closed'"
