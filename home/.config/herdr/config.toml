onboarding = false
# Mirrors the classic tmux defaults in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Agent supervision (adapted from https://github.com/dmmulroy/.dotfiles):
# jump to an Agent panel entry (attention queue, see agent_panel_sort).
focus_agent = "prefix+alt+1..9"
# Jump to the agent that raised the latest notification (pairs with toasts).
open_notification_target = "prefix+i"

# vim-herdr-navigation forwards these into Neovim when focused;
# otherwise they focus the adjacent Herdr pane.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "Navigate left (Vim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "Navigate down (Vim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "Navigate up (Vim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "Navigate right (Vim/Herdr)"

# Herdr Annotate: full install keys from plannotator/herdr-annotate README —
# terminal comments, document review, and agent feedback.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate selected terminal text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as agent context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "Copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in the current folder"

# Upstream uses prefix+shift+o here, but that key is already taken by
# rename_pane above, so the agent's last reply moves to prefix+shift+l
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# Classic tmux never asked on kill-window/kill-session, but a stray keypress can
# nuke a workspace full of running agents, so confirm here.
confirm_close = true

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# Name workspaces so agent sessions stay identifiable (adapted from dmmulroy).
prompt_new_workspace_name = true

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

# Attention queue: agents needing input float to the top instead of grouping
# by workspace (Herdr default is "spaces").
agent_panel_sort = "priority"
# Distinct glyphs for blocked/working/done/idle/unknown agent states.
status_indicators = "symbols"

[ui.toast]
# Pop up when an agent finishes or needs input (Herdr default is "off").
# This is what makes supervising background agents work.
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[advanced]
# 50MB scrollback per pane (default 10MB) for long agent sessions.
scrollback_limit_bytes = 52428800

[experimental]
# Render images (e.g. agent-produced diagrams) in compatible terminals.
kitty_graphics = true
# Persist pane screen history to session-history.json. Saved output may
# contain secrets; it lives in local Herdr state, never in this repo.
pane_history = true
